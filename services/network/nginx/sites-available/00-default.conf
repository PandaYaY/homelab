# Сайт по умолчанию: сюда попадает всё, что не подошло ни к одному
# server_name. Запросы по IP, чужие домены, сканеры.
# Штатный default из пакета nginx выключен, см. README.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 444: nginx закрывает соединение, ничего не ответив
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Отклонить TLS-рукопожатие, не показывая сертификат. Без этого
    # сканер по IP получил бы сертификат vaultwarden и узнал бы домен.
    ssl_reject_handshake on;
}
