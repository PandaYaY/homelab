# Handlers выполняются в порядке объявления: сначала проверка, потом reload.
# Если nginx -t упадёт, reload не случится, и работающий nginx продолжит
# жить со старым конфигом.
- name: Проверить конфиг nginx
  ansible.builtin.command: nginx -t
  changed_when: false
  listen: Проверить и перечитать nginx

- name: Перечитать nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  listen: Проверить и перечитать nginx
