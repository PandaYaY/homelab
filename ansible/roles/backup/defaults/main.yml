# Куда складывать архивы. Пока это та же SD-карта, что и система:
# от ошибок и порчи данных спасает, от смерти карты нет. См. README.
backup_dir: /var/backups/homelab

# Сколько хранить: ежедневные архивы за N дней и воскресные за N недель
backup_keep_daily: 7
backup_keep_weekly: 4

# Когда запускать, время сервера (UTC). 00:30 UTC это 03:30 по Москве.
backup_on_calendar: "*-*-* 00:30:00"
