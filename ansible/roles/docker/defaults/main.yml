docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# /etc/docker/daemon.json
docker_daemon_config:
  # Ротация логов контейнеров: без неё json-логи растут бесконечно,
  # а это лишний износ SD-карты. Действует только на новые контейнеры,
  # существующие нужно пересоздать: apps.yml -e app_recreate=true
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"
  # Контейнеры продолжают работать, пока перезапускается сам Docker,
  # например при обновлении пакета
  live-restore: true
