# get_url в режиме --check всегда сообщает об изменении, поэтому ключ
# скачивается, только если его ещё нет
- name: Проверить ключ репозитория Docker
  ansible.builtin.stat:
    path: /etc/apt/keyrings/docker.asc
  register: docker_key

- name: Ключ репозитория Docker
  when: not docker_key.stat.exists
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Репозиторий Docker
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: "deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable\n"
    owner: root
    group: root
    mode: "0644"
  vars:
    docker_apt_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"

- name: Пакеты Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Настройки демона Docker
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Перезапустить Docker

- name: Docker запущен и включён при загрузке
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
