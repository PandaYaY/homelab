# Службы из образа Armbian, которые серверу не нужны. Они останавливаются и
# маскируются, чтобы их не запустил ни сокет, ни зависимость другого пакета.
# Вернуть: sudo systemctl unmask <unit> && sudo systemctl enable --now <unit>
# Сокеты и path идут первыми, иначе они сразу поднимут службу обратно.
services_disabled:
  - rpcbind.socket
  - rpcbind.service
  - cups.socket
  - cups.path
  - cups.service
  - cups-browsed.service
  - avahi-daemon.socket
  - avahi-daemon.service
  - bluetooth.service
  - ModemManager.service
