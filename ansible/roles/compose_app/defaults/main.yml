# Роль вызывается для одного приложения из списка apps (vars.yml),
# описание приложения приходит в переменной app.

# Пересобрать образ, даже если он уже есть: -e app_rebuild=true
app_rebuild: false

# Пересоздать контейнер, даже если compose и env не менялись:
# -e app_recreate=true. Нужно, например, после смены настроек логов Docker.
app_recreate: false
