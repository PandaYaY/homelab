# Корень репозитория homelab: роли берут конфиги из services/
homelab_repo_root: "{{ inventory_dir }}/../.."
homelab_services_dir: "{{ homelab_repo_root }}/services"

# Каталог, в котором живут приложения на сервере
apps_base_dir: /opt

# Пароль sudo задан в vault.yml как ansible_become_password

# Секреты приложений. Значения лежат в vault.yml, здесь только ссылки,
# чтобы по открытому файлу было видно, какие переменные существуют.
vaultwarden_admin_token: "{{ vault_vaultwarden_admin_token }}"
find_air_bot_token: "{{ vault_find_air_bot_token }}"
find_air_tp_token: "{{ vault_find_air_tp_token }}"
find_air_allowed_user_ids: "{{ vault_find_air_allowed_user_ids }}"

# Уведомления в Telegram об ошибках служб, роль notify
homelab_telegram_token: "{{ vault_homelab_telegram_token }}"
nyaners_telegram_chat_id: "{{ vault_nyaners_telegram_chat_id }}"

# Приложения в Docker Compose. Каждое живёт в {{ apps_base_dir }}/<name>,
# конфиги берутся из services/apps/<name>.
#   env_template  шаблон из services/apps/<name>/templates
#   env_file      имя отрендеренного файла рядом с compose
#   backup        какие базы SQLite копировать онлайн и что не класть в архив
apps:
  - name: find-air
    env_template: find-air.env.j2
    env_file: find-air.env
    backup:
      sqlite: [findair.db]
      exclude: []
  - name: vaultwarden
    env_template: vaultwarden.env.j2
    env_file: vaultwarden.env
    backup:
      sqlite: [db.sqlite3]
      # кэш иконок сайтов и временные файлы восстанавливать не нужно
      exclude: [icon_cache, tmp]

# Для каких доменов на сервере должны быть сертификаты Let's Encrypt
tls_domains:
  - vaultwarden.nyaners.ru

# Домашняя сеть: SSH доступен только из неё
lan_cidr: 192.168.1.0/24
